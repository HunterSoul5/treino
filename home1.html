<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino Pro Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --primary: #38bdf8; /* Azul Ciano Moderno */
            --accent: #818cf8;  /* Roxo Suave */
            --success: #34d399; /* Verde Menta */
            --danger: #f87171;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; outline: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; padding-bottom: 80px; }

        /* --- DASHBOARD & GRÁFICOS --- */
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
        }

        /* --- DIAS E CARDS --- */
        .day-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 6px solid var(--primary);
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h2 { margin: 0; color: var(--text-main); font-size: 1.5rem; }

        .day-obs {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--text-muted);
            color: var(--accent);
            padding: 8px 0;
            font-style: italic;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .day-obs:focus { border-bottom-color: var(--primary); }

        /* --- TÓPICOS --- */
        .topic-group {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .topic-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* --- EXERCÍCIOS --- */
        .exercise-list { display: flex; flex-direction: column; gap: 8px; }

        .exercise-item {
            display: grid;
            grid-template-columns: 24px 1fr auto;
            gap: 12px;
            align-items: center;
            background: var(--bg-input);
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .exercise-item.done {
            background: #064e3b; /* Verde escuro */
            opacity: 0.7;
        }

        .exercise-item.done .ex-name { text-decoration: line-through; color: var(--text-muted); }

        /* Custom Checkbox */
        input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
        }
        input[type="checkbox"]:checked {
            background-color: var(--success);
            border-color: var(--success);
        }

        .ex-info { display: flex; flex-direction: column; }
        .ex-name { font-weight: 600; font-size: 1rem; }
        .ex-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        .ex-link { color: var(--primary); text-decoration: none; font-size: 0.75rem; margin-top: 2px; }

        /* --- FORMULÁRIOS E BOTÕES --- */
        .add-controls {
            margin-top: 15px;
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 8px;
            display: grid;
            gap: 8px;
        }
        
        input[type="text"] {
            background: var(--bg-body);
            border: 1px solid var(--bg-input);
            color: white;
            padding: 10px;
            border-radius: 6px;
        }

        button { cursor: pointer; border: none; font-weight: 600; border-radius: 6px; transition: 0.2s; }
        
        .btn-topic { width: 100%; padding: 10px; background: var(--bg-input); color: var(--text-muted); border: 1px dashed var(--text-muted); }
        .btn-topic:hover { background: var(--bg-card); color: white; border-color: white; }

        .btn-add { background: var(--primary); color: var(--bg-body); padding: 10px; }
        .btn-add:hover { filter: brightness(1.1); }

        .btn-icon { background: transparent; color: var(--danger); font-size: 1.2rem; padding: 5px; }
        .btn-sm-text { background: transparent; color: var(--danger); font-size: 0.7rem; padding: 2px 6px; border: 1px solid var(--danger); }

        /* --- FLOAT ACTION BUTTONS --- */
        .fab-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .btn-float {
            padding: 15px 20px;
            border-radius: 50px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            font-size: 0.9rem;
        }
        .btn-save { background: var(--success); color: var(--bg-body); }
        .btn-reset { background: var(--danger); color: white; }

        /* Mobile */
        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .chart-card { height: 250px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ Treino Pro</h1>
        <p style="color: var(--text-muted);">Painel de Performance do Aluno</p>
    </header>

    <div class="dashboard-grid">
        <div class="chart-card">
            <canvas id="weeklyChart"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="dailyChart"></canvas>
        </div>
    </div>

    <div id="workout-container"></div>
</div>

<div class="fab-container">
    <button class="btn btn-float btn-save" onclick="saveData()">💾 Salvar</button>
    <button class="btn btn-float btn-reset" onclick="resetData()">♻️ Reset</button>
</div>

<script>
    const dias = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
    let workoutData = JSON.parse(localStorage.getItem('fichaTreinoPro')) || {};

    // Instâncias dos Gráficos
    let weeklyChart = null;
    let dailyChart = null;

    function init() {
        const container = document.getElementById('workout-container');
        container.innerHTML = '';

        dias.forEach(dia => {
            if (!workoutData[dia]) workoutData[dia] = { obs: '', topics: [] };
            
            // Estrutura do Card do Dia
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-section';
            dayDiv.innerHTML = `
                <div class="day-header">
                    <h2>${dia}</h2>
                    <button class="btn-sm-text" onclick="addTopic('${dia}')">+ GRUPO MUSCULAR</button>
                </div>
                <input class="day-obs" type="text" placeholder="Anotações do dia (ex: Carga aumentou...)" 
                       value="${workoutData[dia].obs}" onchange="updateDayObs('${dia}', this.value)">
                
                <div id="topics-${dia}"></div>
            `;
            container.appendChild(dayDiv);
            renderTopics(dia);
        });
        
        updateCharts();
    }

    function renderTopics(dia) {
        const topicContainer = document.getElementById(`topics-${dia}`);
        topicContainer.innerHTML = '';

        workoutData[dia].topics.forEach((topic, tIdx) => {
            const topicDiv = document.createElement('div');
            topicDiv.className = 'topic-group';
            topicDiv.innerHTML = `
                <div class="topic-header">
                    <span>${topic.name}</span>
                    <button class="btn-icon" style="font-size:0.8rem" onclick="removeTopic('${dia}', ${tIdx})">REMOVER</button>
                </div>
                <div id="exercises-${dia}-${tIdx}" class="exercise-list"></div>
                
                <div class="add-controls">
                    <input type="text" id="in-name-${dia}-${tIdx}" placeholder="Nome do Exercício">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                        <input type="text" id="in-obs-${dia}-${tIdx}" placeholder="Séries x Reps">
                        <input type="text" id="in-link-${dia}-${tIdx}" placeholder="Link do Youtube (Opcional)">
                    </div>
                    <button class="btn btn-add" onclick="addExercise('${dia}', ${tIdx})">Adicionar</button>
                </div>
            `;
            topicContainer.appendChild(topicDiv);
            renderExercises(dia, tIdx);
        });
    }

    function renderExercises(dia, tIdx) {
        const exContainer = document.getElementById(`exercises-${dia}-${tIdx}`);
        exContainer.innerHTML = '';

        workoutData[dia].topics[tIdx].exercises.forEach((ex, eIdx) => {
            const exDiv = document.createElement('div');
            exDiv.className = `exercise-item ${ex.done ? 'done' : ''}`;
            exDiv.innerHTML = `
                <input type="checkbox" ${ex.done ? 'checked' : ''} onchange="toggleEx('${dia}', ${tIdx}, ${eIdx})">
                <div class="ex-info">
                    <span class="ex-name">${ex.name}</span>
                    <span class="ex-meta">${ex.obs || ''}</span>
                    ${ex.link ? `<a href="${ex.link}" target="_blank" class="ex-link">▶ Ver Vídeo</a>` : ''}
                </div>
                <button class="btn-icon" onclick="removeEx('${dia}', ${tIdx}, ${eIdx})">×</button>
            `;
            exContainer.appendChild(exDiv);
        });
    }

    // --- LÓGICA DE DADOS ---
    function addTopic(dia) {
        const name = prompt("Qual o grupo muscular? (Ex: Costas, Cardio)");
        if (name) {
            workoutData[dia].topics.push({ name: name, exercises: [] });
            renderTopics(dia);
            saveData();
        }
    }

    function removeTopic(dia, tIdx) {
        if(confirm("Apagar este grupo muscular?")) {
            workoutData[dia].topics.splice(tIdx, 1);
            renderTopics(dia);
            saveData();
        }
    }

    function addExercise(dia, tIdx) {
        const nameIn = document.getElementById(`in-name-${dia}-${tIdx}`);
        const linkIn = document.getElementById(`in-link-${dia}-${tIdx}`);
        const obsIn = document.getElementById(`in-obs-${dia}-${tIdx}`);

        if (!nameIn.value) return alert("Digite o nome do exercício");

        workoutData[dia].topics[tIdx].exercises.push({
            name: nameIn.value,
            link: linkIn.value,
            obs: obsIn.value,
            done: false
        });

        nameIn.value = ''; linkIn.value = ''; obsIn.value = '';
        renderExercises(dia, tIdx);
        saveData();
        updateCharts(); // Atualiza gráfico ao adicionar
    }

    function toggleEx(dia, tIdx, eIdx) {
        const ex = workoutData[dia].topics[tIdx].exercises[eIdx];
        ex.done = !ex.done;
        renderExercises(dia, tIdx);
        saveData();
        updateCharts(); // Atualiza gráfico ao marcar
    }

    function removeEx(dia, tIdx, eIdx) {
        workoutData[dia].topics[tIdx].exercises.splice(eIdx, 1);
        renderExercises(dia, tIdx);
        saveData();
        updateCharts();
    }

    function updateDayObs(dia, val) {
        workoutData[dia].obs = val;
        saveData();
    }

    function saveData() {
        localStorage.setItem('fichaTreinoPro', JSON.stringify(workoutData));
    }

    function resetData() {
        if(confirm("CUIDADO: Isso apagará tudo!")) {
            localStorage.removeItem('fichaTreinoPro');
            location.reload();
        }
    }

    // --- GRÁFICOS (CHART.JS) ---
    function updateCharts() {
        // Calcular dados
        let totalExercises = 0;
        let totalDone = 0;
        let dailyTotals = [];
        let dailyDone = [];

        dias.forEach(dia => {
            let dTotal = 0;
            let dDone = 0;
            if(workoutData[dia]) {
                workoutData[dia].topics.forEach(t => {
                    t.exercises.forEach(e => {
                        dTotal++;
                        if(e.done) dDone++;
                    });
                });
            }
            dailyTotals.push(dTotal);
            dailyDone.push(dDone);
            totalExercises += dTotal;
            totalDone += dDone;
        });

        // 1. Gráfico de Rosca (Progresso Total)
        const ctxWeekly = document.getElementById('weeklyChart').getContext('2d');
        if (weeklyChart) weeklyChart.destroy();
        
        weeklyChart = new Chart(ctxWeekly, {
            type: 'doughnut',
            data: {
                labels: ['Concluído', 'Pendente'],
                datasets: [{
                    data: [totalDone, totalExercises - totalDone],
                    backgroundColor: ['#34d399', '#334155'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#94a3b8' } },
                    title: { display: true, text: 'Progresso Semanal', color: '#f1f5f9', font: {size: 16} }
                }
            }
        });

        // 2. Gráfico de Barras (Por Dia)
        const ctxDaily = document.getElementById('dailyChart').getContext('2d');
        if (dailyChart) dailyChart.destroy();

        dailyChart = new Chart(ctxDaily, {
            type: 'bar',
            data: {
                labels: dias.map(d => d.substring(0,3)), // Seg, Ter...
                datasets: [
                    {
                        label: 'Feito',
                        data: dailyDone,
                        backgroundColor: '#38bdf8',
                        borderRadius: 4
                    },
                    {
                        label: 'Meta',
                        data: dailyTotals,
                        backgroundColor: '#1e293b',
                        borderColor: '#334155',
                        borderWidth: 1,
                        borderRadius: 4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
                },
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: 'Volume Diário', color: '#f1f5f9', font: {size: 16} }
                }
            }
        });
    }

    // Inicializar
    init();

</script>
</body>
</html>
